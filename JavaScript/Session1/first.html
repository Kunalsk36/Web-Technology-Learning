<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice</title>
</head>
<body>
    <h1>Hello JS</h1>
    <h2>See console!</h2>

    <script>
        var a;
        console.log(a);
        a = 10;
        console.log(a);
        var a;
        a = "200";
        console.log(a);
        
        let b;
        console.log(b);
        b = 29;
        console.log(b);
        // let b; // can not redeclared
        b = 36;
        console.log(b);
        
        // const pi; // can not declare only
        // a = 3.14 // can not initialize only 
        const pi = 3.14;
        // for const declaration and initialization must be in a single line
        console.log(pi);
    </script>
</body>
</html>
