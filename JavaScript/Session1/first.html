<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice</title>
</head>
<body>
    <h1>Hello JS</h1>
    <h2>See console!</h2>

    <script>
        var a;
        console.log(a);
        a = 10;
        console.log(a);
        var a;
        a = "200";
        console.log(a);
        
        let b;
        console.log(b);
        b = 29;
        console.log(b);
        // let b; // can not redeclared
        b = 36;
        console.log(b);
        
        // const pi; // can not declare only
        // a = 3.14 // can not initialize only 
        const pi = 3.14;
        // for const declaration and initialization must be in a single line
        console.log(pi);


        var place;
        console.log(place);
        var place = "Ratnagiri";
        console.log(place);
        var place = "Pune";
        console.log(place);
        
        console.log(window.place); // window is the supermost object
        
        let food = "Modak";
        console.log(food);
        // console.log(food2); // let variable can not use outside the scope
        console.log(bike); // var variable can be used but it will show undefined.
        {
            var bike = "spendor";
            let food2 = "Gulabjam"
            console.log(bike);
            console.log(food2);
            console.log(food);
        }        
        console.log(bike); // var variable can use 
        // console.log(food2); // let variable cannot use outside the scope
        console.log(food);
        
    </script>
</body>
</html>
