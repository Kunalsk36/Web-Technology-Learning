<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form tag</title>
</head>
<body>
    <form>
        <fieldset>
            <legend><h2>Practice Form</h2></legend>
            <label for="f_user">First Name : </label>
        <input type="text" id="f_user" name="FName" value="Kunal">
        <br><br>
        <label for="l_user">Last Name : </label>
        <input type="text" name="LName" id="l_user">
        <br><br>
        <label for="mail">Email : </label>
        <input type="email" id="mail" name="Email">
        <br><br>
        <label for="phone">Phone No.: </label>
        <input type="tel" name="Phone" id="phone">
        <br><br>
        <label for="pass">Password : </label>
        <input type="password" name="Password" id="password">
        <br><br>

        <label for="dob">Date of Birth : </label> <span>type = "date"</span>
        <input type="date" id="dob" name="dob" > <br><br>
        <span>type = "datetime"</span>
        <input type="datetime" id="dob" name="dob"> <br><br>
        <span>type = "datetime-local"</span>
        <input type="datetime-local" id="dob" name="dob"> <br><br>
        <span>type = "month"</span>
        <input type="month" id="dob" name="dob"> <br><br>
        <span>type = "time"</span>
        <input type="time" id="dob" name="dob"> <br><br>
        <span>type = "week"</span>
        <input type="week" id="dob" name="dob"> <br><br>

        <label for="gender">Gender : </label>
        <input type="radio" name="gender" id="gender" value="male"><span>Male</span>
        <input type="radio" name="gender" id="gender" value="female"><span>Female</span>
        <input type="radio" name="gender" id="gender" value="others"><span>Other</span>
        <br><br>

        <label for="languages">Languages : </label>
        <input type="checkbox" name="lang" id="languages" value="Marathi"><span>Marathi</span>
        <input type="checkbox" name="lang" id="languages" value="Hindi"><span>Hindi</span>
        <input type="checkbox" name="lang" id="languages" value="English"><span>English</span> <br><br>

        <label for="degree">Select Your Degree : </label>
        <select name="degree" id="degree">
            <optgroup label="Bachelors">
                <option value="Bsc" name="degree">Bsc</option>
                <option value="Bcom" name="degree">Bcom</option>
                <option value="BA" name="degree">BA</option>
                <option value="BCA" name="degree">BCA</option>
            </optgroup>
            <optgroup label="Masters">
                <option value="Msc" name="degree">Msc</option>
                <option value="Mcom" name="degree">Mcom</option>
                <option value="MA" name="degree">MA</option>
                <option value="MCA" name="degree">MCA</option>
            </optgroup>
        </select>

        <br><br>
        <label for="color">Choose your color : </label>
        <input type="color" name="color" id="color"> <br><br>

        <label for="address">Address : </label>
        <textarea name="address" id="address" rows="10" cols="40"></textarea> <br><br>

        <label for="resume-file">Upload Resume : </label>
        <input type="file" name="resume" id="resume-file"> <br><br>
        <br><br>

        <h4>these image will work as a submit button: input type="image"</h4>
        <input type="image" src="../Assests/man-with-glasses.png" alt="submit" width="100px"> <br><br>
        <button>Submit</button>
        </fieldset>
    </form>
</body>
</html>
