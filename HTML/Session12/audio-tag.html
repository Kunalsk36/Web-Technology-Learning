<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Tag</title>
</head>
<body>
    <h1>Audio Tag: </h1>
    <h2>Harry Styles - As It Was</h2>
    <h4>added src and controls attribute only:</h4>
    <audio src="../Assests/Harry Styles - As It Was (Official Video)(MP3_320K).mp3" controls></audio>

    <h2>Pritam, Arijit Singh - Khairiyat</h2>
    <h4>added src, controls, muted</h4>
    <h4>So by default audio will be muted</h4>
    <audio src="../Assests/Khairiyat - Pritam, Arijit Singh.m4a" controls muted></audio>

    <h2>Wiz Khalifa - See You Again</h2>
    <h4>added src, controls, autoplay</h4>
    <h4>autoplay will start the music automatically</h4>
    <audio src="../Assests/Wiz Khalifa - See You Again ft. Charlie Puth [Official Video] Furious 7 Soundtrack(MP3_320K).mp3" controls autoplay muted></audio>

</body>
</html>
