<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline & Block Element</title>
</head>
<body>
    <!-- Inline Element - span -->
    <span style="background-color: aqua;">Vijay Deverkonda</span><span style="background-color: pink;">Rashmika Mandana</span>

    <!-- Try to add height and width to inline element: It will won't work because inline element only occupies content height and width -->
    <span style="background-color: powderblue; height: 100px; width: 200px;">Samantha Ruth</span>

    <!-- Block Element - div -->
     <div style="background-color: aquamarine; height: 200px; width: 100px;">Akashay Kumar</div>
     <div style="background-color: burlywood;">Kajal Agarwal</div>
</body>
</html>
