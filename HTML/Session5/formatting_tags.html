<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Tags</title>
</head>
<body>
    <p>Formatting Tags: </p>
    <b>Mobile</b> - bold content - bold Tag <br>
    <strong>Laptop</strong> - something is important <br><br>

    <i>Iron Man</i> - Italic Tag <br>
    <em>Spider Man</em> - Emphasized Tag <br><br>

    <u>Thar The Car</u> - Underline Tag <br>
    <ins>Honda Shine</ins> - Insert Tag <br>

    <p>Deprecated Tags - As user we shouldn't use it</p>
    <center>Kunal</center> <!-- Make the text in center  -->
    <strike>MCA Student</strike> - Strikethrought text
</body>
</html>
