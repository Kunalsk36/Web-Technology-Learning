<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List Tags: </h1>

    <h2>ol tag: </h2>
    <h3>Cars: </h3>
    <ol>
        <li>Fortuner</li>
        <li>Nexon</li>
        <li>Thar</li>
    </ol>
    <ol type="1" start="4">
        <li>Supra</li>
        <li>Bugati</li>
        <li>Mclaren</li>
        <li>Pagani</li>
    </ol>

    <h3>Ice-cream Flavours: </h3>
    <ol type="A">
        <li>Chocolate</li>
        <li>Vanilla</li>
        <li>Butter Scotch</li>
    </ol>

    <h3>Sweets : </h3>
    <ol type="i">
        <li>Modak</li>
        <li>Gulab Jam</li>
        <li>Shikhand</li>
        <li>Amrakhand</li>
    </ol>

    <h3>Flowers :</h3>
    <ol type="I">
        <li>Sunflower</li>
        <li>Rose</li>
        <li>Lilly</li>
    </ol>
</body>
</html>
