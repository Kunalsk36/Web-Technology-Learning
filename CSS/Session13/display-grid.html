<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Grid</title>
    <link rel="stylesheet" href="display-grid.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css" integrity="sha512-tx5+1LWHez1QiaXlAyDwzdBTfDjX07GMapQoFTS74wkcPMsI3So0KYmFe6EHZjI8+eSG0ljBlAQc3PQ5BTaZtQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section class="parent">
        <section class="child contact"><h1>Contact Us</h1></section>
        <section class="child form">
            <form action="">
                <table>
                    <tr>
                        <td><label for="name">Full Name: </label></td>
                        <td><input type="text" id="name" name="name"></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email: </label></td>
                        <td><input type="text" name="email" id="email"></td>
                    </tr>
                    <tr>
                        <td><label for="message">Message: </label></td>
                        <td><textarea name="message" id="message"></textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="button" value="Submit">
                        </td>
                    </tr>
                </table>
            </form>
        </section>
        <section class="child icons">
            <div><i class="fa-brands fa-instagram"></i><span>Instagram</span></div>
            <div><i class="fa-brands fa-snapchat"></i><span>Snapchat</span></div>
            <div><i class="fa-brands fa-whatsapp"></i><span>Whatsapp</span></div>
        </section>
        <section class="child map"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60492.24449161603!2d73.7154738216797!3d18.629624199999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2b96cf7691903%3A0xf2d22a6bdeb6c214!2sMorya%20Pure%20Veg%20Restaurant!5e0!3m2!1sen!2sin!4v1790834116813!5m2!1sen!2sin" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
        <section class="child address">
            <p>Morya Pure Veg Restaurant</p>
            <p>towards, Pimpri-Chinchwad Link Rd, near domino’s pizza, Keshav Nagar, Chinchwad, Pimpri-Chinchwad, Maharashtra 411033</p>
        </section>
    </section>
</body>
</html>
